# Fase 1: de statische site. Gratis, en dit is wat er deze week live kan.
#
# Bewust nog geen database en geen cronjob. Zie render.phase2.yaml en de README:
# van de zeventien bronnen verandert er geen enkele dagelijks, en er is nog geen
# fetcher geimplementeerd. Een nachtelijke taak zou nu negen taken starten die niet
# bestaan en groen afsluiten. Dat vinkje is erger dan geen vinkje.
#
# De cijfers op de site komen uit site/data.json, geschreven door
# `python -m terra.export` en meegecommit. De CI faalt als dat bestand niet meer
# klopt met de database, dus een verouderde deploy kan niet ongemerkt langskomen.

services:
  - type: web
    name: terra-commons
    runtime: static

    # rootDir is hier het hele verhaal.
    #
    # Zonder deze regel kijkt Render naar de repo-wortel, ziet daar
    # requirements.txt staan, concludeert "dit is een Python-project" en draait
    # pip install voordat het aan de site toekomt. Drie deploys zijn daarop
    # gestrand, met een foutmelding over psycopg die niets met de site te maken
    # had. De statische site is de map site/ en verder niets; door dat expliciet
    # te zeggen ziet Render de pijplijn helemaal niet meer staan.
    #
    # Bijvangst: de build duurt nu seconden in plaats van minuten, want er wordt
    # geen rasterio meer gecompileerd voor een pagina die alleen HTML serveert.
    rootDir: site
    staticPublishPath: .

    # Verplicht veld, ook als er niets te bouwen valt: een lege string laat de
    # deploy falen. Een ls in plaats van een stille test, zodat de log laat zien
    # wat er werkelijk in de map staat.
    buildCommand: ls -la && echo "statische site, niets te bouwen"

    previews:
      generation: automatic     # elke pull request krijgt een eigen URL

    headers:
      - path: /data.json
        name: Cache-Control
        value: no-store         # anders toont een bezoeker oude cijfers na een deploy

    # Bewust GEEN catch-all rewrite naar /index.html. Dit is geen single page app,
    # en zo'n regel zou ook /data.json omleiden naar de HTML-pagina. De site laadt
    # haar cijfers dan niet meer, en dat faalt stil: de pagina valt netjes terug op
    # haar ingebouwde waarden en ziet er verder normaal uit.
