name: data

# Handmatig. Geen schema, geen cron.
#
# Twee standen:
#   1. Zonder lau_url  -> alleen de sonde. Rapporteert welke bronadressen kloppen.
#   2. Met lau_url     -> haalt op, laadt in, herberekent, en opent een pull request.

on:
  workflow_dispatch:
    inputs:
      lau_url:
        description: "Gemeentegrenzen. Leeg laten om alleen te sonderen."
        required: false
        default: "https://gisco-services.ec.europa.eu/distribution/v2/lau/geojson/LAU_RG_01M_2023_3035.geojson"
      rain_url:
        description: "Neerslagraster (655 MB). Leeg laten om klimaat over te slaan."
        required: false
        default: "https://os.zhdk.cloud.switch.ch/chelsav2/GLOBAL/climatologies/1981-2010/bio/CHELSA_bio12_1981-2010_V.2.1.tif"
      peek:
        description: "Sonde ook in de inhoud laten kijken (true/false)"
        required: false
        default: "false"
      intent:
        description: "Beheerintentie: dehesa of rewild"
        required: false
        default: "dehesa"

permissions:
  contents: write
  pull-requests: write

jobs:
  probe:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: "3.11" }
      - name: welke bronnen zijn bereikbaar
        run: |
          FLAG=""
          [ "${{ inputs.peek }}" = "true" ] && FLAG="--peek"
          python -m terra.fetch.probe $FLAG | tee probe.txt || true
      - run: python -m terra.fetch.probe --json > probe.json || true
        if: always()
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: probe
          path: |
            probe.txt
            probe.json

  load:
    needs: probe
    if: inputs.lau_url != ''
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgis/postgis:16-3.4
        env:
          POSTGRES_USER: terra
          POSTGRES_PASSWORD: terra
          POSTGRES_DB: terra
        ports: ["5432:5432"]
        options: >-
          --health-cmd pg_isready --health-interval 10s
          --health-timeout 5s --health-retries 5
    env:
      DATABASE_URL: postgresql://terra:terra@localhost:5432/terra
      TERRA_INTENT: ${{ inputs.intent }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: "3.11" }
      - run: pip install -r requirements.txt
      - run: sudo apt-get update && sudo apt-get install -y postgresql-client
      - name: schema, views, constraints, seed
        run: bash scripts/bootstrap.sh
      - name: gemeentegrenzen ophalen en inladen
        run: python -m terra.fetch.load_lau "${{ inputs.lau_url }}"
      - name: neerslag per gemeente uit het raster
        if: inputs.rain_url != ''
        run: python -m terra.fetch.load_climate "${{ inputs.rain_url }}"
      # Na de ophalers en voor de beoordeling. Handmatige leveringen verwijzen naar
      # gemeenten op naam, dus ze kunnen pas landen als de gemeentelaag er staat.
      - name: handmatige leveringen innemen
        run: python -m terra.manual
      - name: gemeentelaag opnieuw beoordelen
        run: python -m terra.nightly
      - name: exporteren naar de site
        run: python -m terra.export
      - name: tests, want de site mag niet uit de pas lopen
        run: python -m pytest -q
      - name: pull request openen
        uses: peter-evans/create-pull-request@v6
        with:
          branch: data/gemeentelaag
          title: "Gemeentelaag bijgewerkt"
          commit-message: "Gemeentelaag ingeladen en site/data.json herberekend"
          body: |
            Automatisch gegenereerd door de workflow `data`, handmatig gestart.
            Kijk in de diff van `site/data.json` wat er veranderd is aan de
            rijpheidspoort en aan de trechter voordat je dit samenvoegt.
          add-paths: site/data.json
